<svg width="1024" height="1024" viewBox="96 96 832 832" xmlns="http://www.w3.org/2000/svg">
  <!-- StatPlot-Logo: Säulen, Messpunkte mit Ausgleichsgerade und Boxplot im selben Stil wie
       PAP Editor / IBD Editor. Quelle für alle Icon-Dateien, erzeugt mit:
       python3 packaging/make_icons.py -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#2B47C4"/>
    </linearGradient>
  </defs>

  <!-- abgerundetes Quadrat mit Rand, wie bei macOS-App-Icons -->
  <rect x="96" y="96" width="832" height="832" rx="186" fill="url(#bg)"/>

  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Achsen -->
    <path d="M232 220 V792 H808" fill="none" stroke-width="36"/>

    <!-- Säulen -->
    <rect x="300" y="560" width="92" height="196" rx="14" stroke="none"/>
    <rect x="424" y="430" width="92" height="326" rx="14" stroke="none"/>

    <!-- Boxplot -->
    <path d="M648 236 V330 M648 566 V660 M604 236 H692 M604 660 H692" fill="none" stroke-width="26"/>
    <rect x="580" y="330" width="136" height="236" rx="14" fill="none" stroke-width="26"/>
    <path d="M580 446 H716" fill="none" stroke-width="30"/>

    <!-- Messpunkte mit Ausgleichsgerade über den Säulen -->
    <path d="M296 452 L540 300" fill="none" stroke-width="18" stroke-dasharray="34 24"/>
    <circle cx="322" cy="420" r="24" stroke="none"/>
    <circle cx="420" cy="398" r="24" stroke="none"/>
    <circle cx="500" cy="300" r="24" stroke="none"/>
  </g>
</svg>
